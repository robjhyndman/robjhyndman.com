<div class="quarto-title-meta$if(github)$ quarto-title-meta-3col$endif$">

  $if(date)$
  <div>
    <div class="quarto-title-meta-heading">Date</div>
    <div class="quarto-title-meta-contents">
      <p class="date">$date$</p>
    </div>
  </div>
  $endif$

  $if(venue)$
  <div>
    <div class="quarto-title-meta-heading">Venue</div>
    <div class="quarto-title-meta-contents">
      <p class="date">$venue$</p>
    </div>
  </div>
  $endif$

  $if(github)$
  <div>
    <div class="quarto-title-meta-heading">Code</div>
    <div class="quarto-title-meta-contents">
      <p class="date"><a href="http://github.com/$github$" class="badge badge badge-green"><i class="bi bi-github"></i></a></p>
    </div>
  </div>
  $endif$
</div>

$if(abstract)$
<div>
  <div class="abstract">
    <div class="abstract-title">$labels.abstract$</div>
    $abstract$
  </div>
</div>
$endif$

<p>&nbsp;</p>
